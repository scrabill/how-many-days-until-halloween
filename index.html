<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>How Many Days Until Halloween?</title>
    <meta name="description" content="A Javascript countdown to the spookiest day of the year.">
    <!-- Favicon -->
    <link rel="apple-touch-icon" sizes="180x180" href="assets/favicon_io/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon_io/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="assets/favicon_io/favicon-16x16.png">
    <!--Open Graph-->
    <meta property="og:title" content="How Many Days Until Halloween?" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://halloweenti.me/" />
    <meta property="og:description" content="A Javascript countdown to the spookiest day of the year." />
    <meta property="og:image" content="http://github.com/scrabill/how-many-days-until-halloween/blob/master/assets/social-preview-2025.png?raw=true" />
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&family=Nunito:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Nunito', sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #e0e0e0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }
        
        /* Floating pastel elements in background */
        .bg-element {
            position: fixed;
            border-radius: 50%;
            opacity: 0.1;
            pointer-events: none;
            animation: float 20s ease-in-out infinite;
        }
        
        .bg-element:nth-child(1) {
            width: 300px;
            height: 300px;
            background: #c4b5fd;
            top: -100px;
            left: -100px;
            animation-delay: 0s;
        }
        
        .bg-element:nth-child(2) {
            width: 200px;
            height: 200px;
            background: #fbbf24;
            top: 60%;
            right: -50px;
            animation-delay: 5s;
        }
        
        .bg-element:nth-child(3) {
            width: 250px;
            height: 250px;
            background: #a7f3d0;
            bottom: -80px;
            left: 30%;
            animation-delay: 10s;
        }
        
        @keyframes float {
            0%, 100% {
                transform: translateY(0) rotate(0deg);
            }
            50% {
                transform: translateY(-30px) rotate(5deg);
            }
        }
        
        .container {
            text-align: center;
            position: relative;
            z-index: 1;
            max-width: 600px;
            width: 100%;
        }
        
        .emoji-decoration {
            font-size: 3rem;
            display: inline-block;
            animation: gentle-bounce 3s ease-in-out infinite;
            margin-bottom: 1rem;
        }
        
        @keyframes gentle-bounce {
            0%, 100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-10px);
            }
        }
        
        h1 {
            font-family: 'Fredoka', sans-serif;
            font-size: clamp(1.8rem, 5vw, 3rem);
            font-weight: 600;
            background: linear-gradient(135deg, #c4b5fd 0%, #fbbf24 50%, #fda4af 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 2rem;
            line-height: 1.3;
        }
        
        .countdown-box {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 2px solid rgba(196, 181, 253, 0.3);
            border-radius: 30px;
            padding: 3rem 2rem;
            margin-bottom: 2rem;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        
        .countdown-box:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 40px rgba(196, 181, 253, 0.2);
        }
        
        .days-number {
            font-family: 'Fredoka', sans-serif;
            font-size: clamp(4rem, 15vw, 8rem);
            font-weight: 600;
            background: linear-gradient(135deg, #fbbf24 0%, #fda4af 50%, #c4b5fd 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            line-height: 1;
            margin-bottom: 0.5rem;
        }
        
        .days-label {
            font-size: clamp(1.2rem, 3vw, 1.5rem);
            color: #c4b5fd;
            text-transform: uppercase;
            letter-spacing: 0.2em;
            font-weight: 700;
        }
        
        .vibe-message {
            font-size: clamp(1rem, 2.5vw, 1.3rem);
            color: #a7f3d0;
            margin-bottom: 2rem;
            padding: 1rem;
            background: rgba(167, 243, 208, 0.1);
            border-radius: 15px;
            font-style: italic;
            min-height: 3rem;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .share-buttons {
            display: flex;
            gap: 1rem;
            justify-content: center;
            flex-wrap: wrap;
        }
        
        .share-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid rgba(196, 181, 253, 0.3);
            color: #e0e0e0;
            padding: 0.8rem 1.5rem;
            border-radius: 50px;
            font-family: 'Nunito', sans-serif;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }
        
        .share-btn:hover {
            background: rgba(196, 181, 253, 0.2);
            border-color: #c4b5fd;
            transform: translateY(-2px);
        }
        
        .share-btn:focus {
            outline: 2px solid #c4b5fd;
            outline-offset: 2px;
        }
        
        .share-btn:active {
            transform: translateY(0);
        }
        
        .copy-feedback {
            position: fixed;
            top: 20px;
            right: 20px;
            background: #a7f3d0;
            color: #1a1a2e;
            padding: 1rem 1.5rem;
            border-radius: 15px;
            font-weight: 700;
            opacity: 0;
            transform: translateY(-20px);
            transition: all 0.3s ease;
            pointer-events: none;
            z-index: 1000;
        }
        
        .copy-feedback.show {
            opacity: 1;
            transform: translateY(0);
        }
        
        footer {
            position: fixed;
            bottom: 20px;
            font-size: 0.9rem;
            color: rgba(255, 255, 255, 0.5);
        }
        
        footer a {
            color: #c4b5fd;
            text-decoration: none;
            transition: color 0.3s ease;
        }
        
        footer a:hover {
            color: #fbbf24;
        }
        
        @media (max-width: 480px) {
            .countdown-box {
                padding: 2rem 1.5rem;
            }
            
            .share-buttons {
                flex-direction: column;
            }
            
            .share-btn {
                width: 100%;
                max-width: 300px;
            }
        }
        
        /* Reduce motion for accessibility */
        @media (prefers-reduced-motion: reduce) {
            .emoji-decoration,
            .bg-element {
                animation: none;
            }
            
            .countdown-box:hover {
                transform: none;
            }
            
            .share-btn:hover {
                transform: none;
            }
        }
    </style>
</head>
<body>
    <div class="bg-element"></div>
    <div class="bg-element"></div>
    <div class="bg-element"></div>
    
    <div class="container">
        <div class="emoji-decoration" role="img" aria-label="jack-o-lantern">🎃</div>
        <h1>How Many Days Until Halloween?</h1>
        
        <div class="countdown-box">
            <div class="days-number" id="daysCount" aria-live="polite">0</div>
            <div class="days-label">Days</div>
        </div>
        
        <div class="vibe-message" id="vibeMessage" aria-live="polite"></div>
        
        <div class="share-buttons">
            <button class="share-btn" id="shareTwitter" aria-label="Share on Twitter">
                <span aria-hidden="true">🐦</span> Twitter
            </button>
            <button class="share-btn" id="shareFacebook" aria-label="Share on Facebook">
                <span aria-hidden="true">📘</span> Facebook
            </button>
            <button class="share-btn" id="copyLink" aria-label="Copy link to clipboard">
                <span aria-hidden="true">🔗</span> Copy Link
            </button>
        </div>
    </div>
    
    <div class="copy-feedback" id="copyFeedback" role="status" aria-live="polite">
        Link copied to clipboard! ✨
    </div>
    
    <footer>
        <p>Made with 💜 for spooky season | <a href="https://github.com/scrabill/how-many-days-until-halloween">How Many Days Until Halloween</a> is a project by <a href="http://shannoncrabill.com/">Shannon Crabill</a>.</p>
    </footer>
    
    <script>
        // Calculate days until next Halloween
        function getDaysUntilHalloween() {
            const today = new Date();
            const currentYear = today.getFullYear();
            
            // Set Halloween date for current year
            let halloween = new Date(currentYear, 9, 31); // October is month 9 (0-indexed)
            
            // If Halloween has passed this year, calculate for next year
            if (today > halloween) {
                halloween = new Date(currentYear + 1, 9, 31);
            }
            
            // Calculate difference in milliseconds
            const diffTime = halloween - today;
            const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
            
            return diffDays;
        }
        
        // Get vibe message based on days remaining
        function getVibeMessage(days) {
            if (days === 0) {
                return "It's Halloween! Happy haunting! 👻🎃";
            } else if (days === 1) {
                return "Tomorrow is Halloween! Get your costume ready! 🦇";
            } else if (days <= 7) {
                return "Halloween is right around the corner! So exciting! ✨";
            } else if (days <= 30) {
                return "Spooky season is in full swing! 🍂👻";
            } else if (days <= 60) {
                return "Getting closer... time to plan your costume! 🎭";
            } else if (days <= 90) {
                return "Not too far now... the autumn vibes are coming! 🍁";
            } else if (days <= 180) {
                return "Still a ways to go, but it's never too early to be spooky! 🕷️";
            } else {
                return "Halloween is far away, but we can dream of candy and costumes! 🍬";
            }
        }
        
        // Update the countdown display
        function updateCountdown() {
            const days = getDaysUntilHalloween();
            const vibeMessage = getVibeMessage(days);
            
            document.getElementById('daysCount').textContent = days;
            document.getElementById('vibeMessage').textContent = vibeMessage;
        }
        
        // Share functionality
        function setupShareButtons() {
            const url = window.location.href;
            const days = getDaysUntilHalloween();
            const text = `Only ${days} days until Halloween! 🎃👻`;
            
            // Twitter share
            document.getElementById('shareTwitter').addEventListener('click', () => {
                const twitterUrl = `https://twitter.com/intent/tweet?text=${encodeURIComponent(text)}&url=${encodeURIComponent(url)}`;
                window.open(twitterUrl, '_blank', 'width=550,height=420');
            });
            
            // Facebook share
            document.getElementById('shareFacebook').addEventListener('click', () => {
                const facebookUrl = `https://www.facebook.com/sharer/sharer.php?u=${encodeURIComponent(url)}`;
                window.open(facebookUrl, '_blank', 'width=550,height=420');
            });
            
            // Copy link
            document.getElementById('copyLink').addEventListener('click', async () => {
                try {
                    await navigator.clipboard.writeText(url);
                    showCopyFeedback();
                } catch (err) {
                    // Fallback for older browsers
                    const textArea = document.createElement('textarea');
                    textArea.value = url;
                    textArea.style.position = 'fixed';
                    textArea.style.left = '-999999px';
                    document.body.appendChild(textArea);
                    textArea.select();
                    try {
                        document.execCommand('copy');
                        showCopyFeedback();
                    } catch (err) {
                        console.error('Failed to copy:', err);
                    }
                    document.body.removeChild(textArea);
                }
            });
        }
        
        // Show copy feedback
        function showCopyFeedback() {
            const feedback = document.getElementById('copyFeedback');
            feedback.classList.add('show');
            setTimeout(() => {
                feedback.classList.remove('show');
            }, 2000);
        }
        
        // Initialize on page load
        updateCountdown();
        setupShareButtons();
        
        // Update countdown at midnight
        const now = new Date();
        const tomorrow = new Date(now.getFullYear(), now.getMonth(), now.getDate() + 1);
        const msUntilMidnight = tomorrow - now;
        
        setTimeout(() => {
            updateCountdown();
            // Then update every 24 hours
            setInterval(updateCountdown, 24 * 60 * 60 * 1000);
        }, msUntilMidnight);
    </script>
</body>
</html>
